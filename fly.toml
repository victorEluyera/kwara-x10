# Fly.io. Unlike most free tiers Fly gives you a real persistent volume, so
# SQLite keeps working exactly as it does locally and nothing is lost.
#
#   fly launch --no-deploy
#   fly volumes create kwarax10_data --size 1
#   fly secrets set KWARA_SECRET="$(openssl rand -hex 32)"
#   fly deploy
#
app = "kwarax10"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  KWARA_DB = "/data/kwarax10.db"
  KWARA_UPLOADS = "/data/uploads"
  SEED_ON_BOOT = "1"

[[mounts]]
  source = "kwarax10_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"
